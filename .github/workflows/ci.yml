name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: guardian_test
          POSTGRES_USER: guardian_test
          POSTGRES_PASSWORD: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian_test -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VPS_GUARDIAN_TEST_POSTGRES_DSN: postgresql+psycopg://guardian_test:guardian_test@127.0.0.1:5432/guardian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy controller
      - run: sudo "$(command -v pytest)"
      - name: PostgreSQL 0014 forward and rollback migration
        env:
          GUARDIAN_ENVIRONMENT: test
          GUARDIAN_DATABASE_URL: postgresql+psycopg://guardian_test:guardian_test@127.0.0.1:5432/guardian_test
          GUARDIAN_ONE_COMMAND_INSTALL_ENABLED: 'false'
        run: |
          alembic -c controller/alembic.ini upgrade head
          test "$(alembic -c controller/alembic.ini current)" != ""
          alembic -c controller/alembic.ini downgrade 0013_agent_enrollment
          alembic -c controller/alembic.ini upgrade head
      - run: pip-audit --requirement requirements.lock --disable-pip
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/vps-guardian-wheel .
      - run: python -m venv /tmp/vps-guardian-wheel-test
      - run: /tmp/vps-guardian-wheel-test/bin/python -m pip install --no-deps /tmp/vps-guardian-wheel/*.whl
      - run: /tmp/vps-guardian-wheel-test/bin/python -c 'import guardian; assert guardian.__version__ == "0.3.0a1"'

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer shell gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/install-agent.sh scripts/maintain-agent.sh scripts/uninstall-agent.sh
          sh -n scripts/install-agent.sh scripts/maintain-agent.sh scripts/uninstall-agent.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Shell checks and isolated nftables/TC integration
        env:
          VPS_GUARDIAN_NETNS_TEST: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 shellcheck
          bash -n \
            scripts/install-port-traffic-helper.sh \
            scripts/uninstall-port-traffic-helper.sh \
            tests/integration-port-traffic-netns.sh
          shellcheck \
            scripts/install-port-traffic-helper.sh \
            scripts/uninstall-port-traffic-helper.sh \
            tests/integration-port-traffic-netns.sh
          sudo --preserve-env=VPS_GUARDIAN_NETNS_TEST \
            bash tests/integration-port-traffic-netns.sh
      - name: Build immutable Agent artifacts and provenance manifest
        working-directory: agent
        run: |
          install -d -m 0755 /tmp/vps-guardian-agent-release/sbom
          install -m 0755 ../scripts/install-agent.sh /tmp/vps-guardian-agent-release/install-agent.sh
          install -m 0755 ../scripts/maintain-agent.sh /tmp/vps-guardian-agent-release/maintain-agent.sh
          version=0.4.0-ci
          build_time=1970-01-01T00:00:00Z
          build_id_prefix="${version}+$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath \
            -ldflags="-s -w -buildid= -X main.agentVersion=${version} -X main.buildCommit=${GITHUB_SHA} -X main.buildTime=${build_time} -X main.buildID=${build_id_prefix}-linux-amd64 -X main.buildDirty=false" \
            -o /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -buildvcs=false -trimpath \
            -ldflags="-s -w -buildid= -X main.agentVersion=${version} -X main.buildCommit=${GITHUB_SHA} -X main.buildTime=${build_time} -X main.buildID=${build_id_prefix}-linux-arm64 -X main.buildDirty=false" \
            -o /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath -ldflags="-s -w -buildid=" \
            -o /tmp/vps-guardian-agent-release/vps-guardian-net-helper-linux-amd64 ./nethelper
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -buildvcs=false -trimpath -ldflags="-s -w -buildid=" \
            -o /tmp/vps-guardian-agent-release/vps-guardian-net-helper-linux-arm64 ./nethelper
          /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-amd64 version \
            | grep -Fx "git_sha=${GITHUB_SHA}"
          /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-amd64 --version \
            | grep -Eq '^artifact_sha256=[a-f0-9]{64}$'
          python3 ../scripts/agent-release-metadata.py \
            --output /tmp/vps-guardian-agent-release/agent-release-manifest.json \
            --sbom-output /tmp/vps-guardian-agent-release/sbom/agent.cdx.json \
            --version "$version" \
            --git-sha "$GITHUB_SHA" \
            --build-time "$build_time" \
            --build-id-prefix "$build_id_prefix" \
            --go-version "$(go version | awk '{print $3}')" \
            --dirty false \
            --artifact linux amd64 /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-amd64 \
            --artifact linux arm64 /tmp/vps-guardian-agent-release/vps-guardian-agent-linux-arm64
          (
            cd /tmp/vps-guardian-agent-release
            sha256sum \
              install-agent.sh \
              maintain-agent.sh \
              vps-guardian-agent-linux-amd64 \
              vps-guardian-agent-linux-arm64 \
              > checksums.sha256
            printf 'version=v%s\n' "$version" > install-manifest.txt
            printf 'sha256_install_agent=%s\n' "$(sha256sum install-agent.sh | awk '{print $1}')" >> install-manifest.txt
            printf 'sha256_maintain_agent=%s\n' "$(sha256sum maintain-agent.sh | awk '{print $1}')" >> install-manifest.txt
            printf 'sha256_linux_amd64=%s\n' "$(sha256sum vps-guardian-agent-linux-amd64 | awk '{print $1}')" >> install-manifest.txt
            printf 'sha256_linux_arm64=%s\n' "$(sha256sum vps-guardian-agent-linux-arm64 | awk '{print $1}')" >> install-manifest.txt
            signing_dir="$(mktemp -d)"
            trap 'rm -rf -- "$signing_dir"' EXIT HUP INT TERM
            openssl genpkey -algorithm ED25519 -out "$signing_dir/private.pem"
            openssl pkey -in "$signing_dir/private.pem" -pubout -out release-signing-ed25519.pem
            openssl pkeyutl -sign -inkey "$signing_dir/private.pem" -rawin \
              -in install-manifest.txt -out install-manifest.txt.sig
            openssl pkeyutl -verify -pubin -inkey release-signing-ed25519.pem -rawin \
              -in install-manifest.txt -sigfile install-manifest.txt.sig
            test ! -e private.pem
            ! grep -R -l -- 'BEGIN PRIVATE KEY' ./
          )
      - name: Agent release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vps-guardian-agent-release
          path: /tmp/vps-guardian-agent-release
          if-no-files-found: error
          retention-days: 14

  agent-install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [ubuntu, debian, rocky, alpine]
        architecture: [amd64, arm64]
        include:
          - distribution: ubuntu
            image: ubuntu:24.04
          - distribution: debian
            image: debian:12
          - distribution: rocky
            image: rockylinux:9
          - distribution: alpine
            image: alpine:3.21
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Installer filesystem and cryptographic contract
        env:
          DISTRO: ${{ matrix.distribution }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.architecture }}
        run: |
          case "$DISTRO" in
            ubuntu|debian)
              packages='apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y openssl coreutils grep sed'
              ;;
            rocky)
              packages='dnf install -y openssl grep sed'
              ;;
            alpine)
              packages='apk add --no-cache openssl coreutils grep sed'
              ;;
          esac
          docker run --rm --platform "linux/$ARCH" \
            -e "EXPECTED_DISTRIBUTION=$DISTRO" \
            -e "EXPECTED_ARCHITECTURE=$ARCH" \
            -v "$PWD:/workspace:ro" -w /workspace "$IMAGE" \
            sh -ec "$packages; sh tests/container/agent-installer-contract.sh"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --ignore-scripts
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm audit --audit-level=high

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --ignore-scripts
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:visual

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Root-owned Secret reader regression
        run: |
          bash -n operations/scripts/read-root-secret-file.sh
          bash -n operations/scripts/tests/read-root-secret-file.test.sh
          sudo bash operations/scripts/tests/read-root-secret-file.test.sh
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-and-images:
    runs-on: ubuntu-latest
    env:
      VPS_GUARDIAN_CONTROLLER_IMAGE: ci-vps-guardian-controller:${{ github.sha }}
      VPS_GUARDIAN_BACKUP_IMAGE: ci-vps-guardian-backup:${{ github.sha }}
      VPS_GUARDIAN_WEB_IMAGE: ci-vps-guardian-web:${{ github.sha }}
      VPS_GUARDIAN_DATABASE_IMAGE: ci-vps-guardian-postgres:${{ github.sha }}
      VPS_GUARDIAN_RELEASE_VERSION: 0.4.0-ci
      VPS_GUARDIAN_SOURCE_COMMIT: ${{ github.sha }}
      VPS_GUARDIAN_BUILD_TIME: 1970-01-01T00:00:00Z
      VPS_GUARDIAN_SOURCE_URL: https://github.com/liumingxu0122-hue/vps-guardian
      VPS_GUARDIAN_LICENSE: Apache-2.0
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Gate-closure Secret overlay config
        run: |
          install -d -m 0700 /tmp/guardian-offsite-secrets /tmp/guardian-notification-secrets
          for name in restic-repository restic-password aws-access-key-id aws-secret-access-key aws-default-region; do
            install -m 0600 /dev/null "/tmp/guardian-offsite-secrets/$name"
          done
          GUARDIAN_OFFSITE_SECRETS_DIR=/tmp/guardian-offsite-secrets \
          GUARDIAN_NOTIFICATION_SECRETS_DIR=/tmp/guardian-notification-secrets \
            docker compose \
              -f docker-compose.yml \
              -f deploy/offsite-backup.compose.yml \
              -f deploy/notification-secrets.compose.yml \
              config --quiet
      - run: docker compose build database controller backup web
      - name: Immutable OCI label gate
        run: |
          for image in \
            "$VPS_GUARDIAN_DATABASE_IMAGE" \
            "$VPS_GUARDIAN_CONTROLLER_IMAGE" \
            "$VPS_GUARDIAN_BACKUP_IMAGE" \
            "$VPS_GUARDIAN_WEB_IMAGE"; do
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VPS_GUARDIAN_RELEASE_VERSION"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$VPS_GUARDIAN_SOURCE_COMMIT"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$VPS_GUARDIAN_BUILD_TIME"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "$VPS_GUARDIAN_SOURCE_URL"
          done
      - name: Source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: source.spdx.json
          artifact-name: vps-guardian-source-sbom
      - name: Controller image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ci-vps-guardian-controller:${{ github.sha }}
          format: cyclonedx-json
          output-file: controller.cdx.json
          artifact-name: vps-guardian-controller-sbom
      - name: Web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ci-vps-guardian-web:${{ github.sha }}
          format: cyclonedx-json
          output-file: web.cdx.json
          artifact-name: vps-guardian-web-sbom
      - name: Backup image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ci-vps-guardian-backup:${{ github.sha }}
          format: cyclonedx-json
          output-file: backup.cdx.json
          artifact-name: vps-guardian-backup-sbom
      - name: Database image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ci-vps-guardian-postgres:${{ github.sha }}
          format: cyclonedx-json
          output-file: database.cdx.json
          artifact-name: vps-guardian-database-sbom
      - name: Controller image Critical gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-controller:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL
      - name: Controller image fixable High gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-controller:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          skip-setup-trivy: true
      - name: Web image Critical gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-web:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL
          skip-setup-trivy: true
      - name: Web image fixable High gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          skip-setup-trivy: true
      - name: Backup image Critical gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-backup:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL
          skip-setup-trivy: true
      - name: Backup image fixable High gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-backup:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          skip-setup-trivy: true
      - name: Database image Critical gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-postgres:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL
          skip-setup-trivy: true
      - name: Database image fixable High gate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ci-vps-guardian-postgres:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          skip-setup-trivy: true
