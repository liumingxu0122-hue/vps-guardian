services:
  backup:
    environment:
      RESTIC_REPOSITORY: ""
      RESTIC_REPOSITORY_FILE: /run/secrets/offsite_restic_repository
      RESTIC_PASSWORD_FILE: /run/secrets/offsite_restic_password
      RESTIC_LOCAL_REPOSITORY_ROOT: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/offsite_aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/offsite_aws_secret_access_key
      AWS_DEFAULT_REGION_FILE: /run/secrets/offsite_aws_default_region
    volumes:
      - ${GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR:?set GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR}/restic-repository:/run/secrets/offsite_restic_repository:ro
      - ${GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR:?set GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR}/restic-password:/run/secrets/offsite_restic_password:ro
      - ${GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR:?set GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR}/aws-access-key-id:/run/secrets/offsite_aws_access_key_id:ro
      - ${GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR:?set GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR}/aws-secret-access-key:/run/secrets/offsite_aws_secret_access_key:ro
      - ${GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR:?set GUARDIAN_OFFSITE_RUNTIME_SECRETS_DIR}/aws-default-region:/run/secrets/offsite_aws_default_region:ro
