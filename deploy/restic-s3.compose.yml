services:
  backup:
    environment:
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
      AWS_DEFAULT_REGION_FILE: /run/secrets/aws_default_region
    volumes:
      - ${GUARDIAN_RUNTIME_SECRETS_DIR:-./secrets/runtime}/backup/aws-access-key-id:/run/secrets/aws_access_key_id:ro
      - ${GUARDIAN_RUNTIME_SECRETS_DIR:-./secrets/runtime}/backup/aws-secret-access-key:/run/secrets/aws_secret_access_key:ro
      - ${GUARDIAN_RUNTIME_SECRETS_DIR:-./secrets/runtime}/backup/aws-region:/run/secrets/aws_default_region:ro
